<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz</title>


<style>
body {
    background: linear-gradient(135deg, #000000, #1a1a1a);
    margin: 0;
   font-family: "Courier New", Courier, monospace;
}

.navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            width: 100%;
            padding: 10px 12px;
            border-bottom: 1px solid #88ff00;
            background: #000;
        }.logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #88ff00;
            font-weight: bold;
        }

        .logo img {
            height: 40px;
            width: auto;
            display: block;
        }

        .logo, #flogo{
            color: #88ff00;
            font-weight: bold;
            white-space: nowrap;
        }
        
        

        .menu-toggle {
            display: none;
            font-size: 20px;
            color: #88ff00;
            cursor: pointer;
            position: relative;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .menu-toggle::before,
        .menu-toggle::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0.7;
        }

        .menu-toggle::before {
            color: #00ffea;
            animation: glitch1 0.6s infinite;
        }

        .menu-toggle::after {
            color: #ff008c;
            animation: glitch2 0.6s infinite;
        }

        @keyframes glitch1 {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(-2px, 1px);
            }

            40% {
                transform: translate(-1px, -1px);
            }

            60% {
                transform: translate(2px, 0);
            }

            80% {
                transform: translate(1px, -2px);
            }

            100% {
                transform: translate(0);
            }
        }

        @keyframes glitch2 {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(2px, -1px);
            }

            40% {
                transform: translate(1px, 1px);
            }

            60% {
                transform: translate(-2px, 0);
            }

            80% {
                transform: translate(-1px, 2px);
            }

            100% {
                transform: translate(0);
            }
        }

        .nav-links {
            display: flex;
            flex: 1;
            justify-content: center;
            gap: 18px;
        }

        .nav-links a {
            color: #bbffc1;
            text-decoration: none;
            transition: 0.2s;
            position: relative;
            display: inline-block;
        }

        .nav-links a:hover {
            color: #88ff00;
            text-shadow: 0 0 6px #88ff00;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0%;
            height: 1px;
            background: #88ff00;
            transition: 0.2s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a::before,
        .nav-links a::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0.7;
            pointer-events: none;
        }

        .nav-links a::before {
            color: #00ffea;
            animation: glitch1 0.6s infinite;
        }

        .nav-links a::after {
            color: #ff008c;
            animation: glitch2 0.6s infinite;
        }

        .system-right {
            color: #777;
            font-size: 13px;
            white-space: nowrap;
        }
h1 {
    text-align: center;
    color: rgb(136, 255, 0);
    margin: 30px 0;
    text-shadow: 0 0 10px rgb(136, 255, 0);
}

.gallery, .divider {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 25px;
    padding: 40px;
}


.card {
    background: #2c2c2c;
    border-radius: 15px;
    overflow: hidden;
    transition: 0.3s;
    cursor: pointer;
}

.card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgb(136, 255, 0);
}

.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}

.card p {
    padding: 10px;
    text-align: center;
    color: #bbffc1;
    font-weight: bold;
}


.modal {
    display: none;
    position: fixed;
    z-index: 10;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}

.modal img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 10px;
}
@media (max-width: 700px) {

    .wrapper {
        flex-direction: column;
    }

    .col.right .card {
        flex-direction: row;
        text-align: left;
    }
     .menu-toggle {
                display: block;
            }

            .navbar {
                position: relative;
            }

            .nav-links {
                position: absolute;
                top: 55px;
                right: 10px;
                width: 160px;
                display: none;
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
                padding: 10px;
                background: #000;
                border: 1px solid #88ff00;
                border-radius: 6px;
                z-index: 9999;
            }


            .nav-links.active {
                display: flex;
            }
              #time {
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                color: #777;
                font-size: 13px;
            }

}

</style>
</head>

<body>

<div class="navbar">
        <div class="logo">
            <img src="image/ionkno.gif" alt="logo">
            <span>stxnOS</span>
        </div>
        <div class="menu-toggle" id="menuToggle" data-text="1">1</div>
        <div class="nav-links" id="navLinks">
            <a href="index.html" data-text=">index@">>index@</a>
            <a href="dashboard.html" data-text=">dashboard@">>dashboard@</a>
            <a href="outputs.html" data-text=">outputs@">>outputs@</a>
        </div>
        <div class="system-right" id="time"></div>
    </div>

<h1>>Quiz$$</h1>

<div class="gallery">

    <div class="card" onclick="openModal(this)">
        <img src="qImages/quiz1.jpg" alt="Quiz 1">
        <p>>quiz_1</p>
    </div>

    <div class="card" onclick="openModal(this)">
        <img src="qImages/quiz2.jpg" alt="Quiz 2">
        <p>>quiz_2</p>
    </div>

    <div class="card" onclick="openModal(this)">
        <img src="qImages/quiz3.1.jpg" alt="Quiz 3.1">
        <p>>quiz_3.1</p>
    </div>

    <div class="card" onclick="openModal(this)">
        <img src="qImages/quiz3.2.jpg" alt="Quiz 3.2">
        <p>>quiz_3.2</p>
    </div>

<div class="card" onclick="openModal(this)">
        <img src="qImages/Screenshot_2026-04-21-19-58-53-512_com.brave.browser-edit.jpg" alt="Long Quiz">
        <p>>long_Quiz@</p>
</div>
    
    <div class="card" onclick="openModal(this)">
        <img src="qImages/carousel.jpg" alt="Carousel">
        <p>>carousel@</p>
    </div>
    
    
<div class="divider">
  <h4>FINALS</h4>
    <div class="card" onclick="openModal(this)">
        <img src="qImages/finalQuiz1.jpg" alt=">finalQuiz_1">
        <p>>finalQuiz_1</p>
    </div>
    
     <div class="card" onclick="openModal(this)">
        <img src="qImages/finalQuiz2.jpg" alt=">finalQuiz_2">
        <p>>finalQuiz_2</p>
    </div>
</div>
    
</div>

<div class="modal" id="modal" onclick="closeModal()">
    <img id="modalImg">
</div>



<script>
   function updateTime() {
            document.getElementById("time").textContent =
                new Date().toLocaleTimeString();
        }

        setInterval(updateTime, 1000);
        updateTime();
        
         toggle.addEventListener("click", () => {
            nav.classList.toggle("active");

            if (toggle.textContent === "1") {
                toggle.textContent = "0";
                toggle.setAttribute("data-text", "0");
            } else {
                toggle.textContent = "1";
                toggle.setAttribute("data-text", "1");
            }
        });
  
function openModal(card) {
    const img = card.querySelector("img").src;
    document.getElementById("modalImg").src = img;
    document.getElementById("modal").style.display = "flex";
}

function closeModal() {
    document.getElementById("modal").style.display = "none";
}
</script>

</body>
</html>
