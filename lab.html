<style>
* {
            box-sizing: border-box;
        }
body {
    margin: 0;
    font-family: "Courier New", Courier, monospace;
    background: #000;
    color: #bbffc1;
}

  .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            width: 100%;
            padding: 10px 12px;
            border-bottom: 1px solid #88ff00;
            background: #000;
        }.logo {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #88ff00;
            font-weight: bold;
        }

        .logo img {
            height: 40px;
            width: auto;
            display: block;
        }

        .logo, #flogo{
            color: #88ff00;
            font-weight: bold;
            white-space: nowrap;
        }
        
        

        .menu-toggle {
            display: none;
            font-size: 20px;
            color: #88ff00;
            cursor: pointer;
            position: relative;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .menu-toggle::before,
        .menu-toggle::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0.7;
        }

        .menu-toggle::before {
            color: #00ffea;
            animation: glitch1 0.6s infinite;
        }

        .menu-toggle::after {
            color: #ff008c;
            animation: glitch2 0.6s infinite;
        }

        @keyframes glitch1 {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(-2px, 1px);
            }

            40% {
                transform: translate(-1px, -1px);
            }

            60% {
                transform: translate(2px, 0);
            }

            80% {
                transform: translate(1px, -2px);
            }

            100% {
                transform: translate(0);
            }
        }

        @keyframes glitch2 {
            0% {
                transform: translate(0);
            }

            20% {
                transform: translate(2px, -1px);
            }

            40% {
                transform: translate(1px, 1px);
            }

            60% {
                transform: translate(-2px, 0);
            }

            80% {
                transform: translate(-1px, 2px);
            }

            100% {
                transform: translate(0);
            }
        }

        .nav-links {
            display: flex;
            flex: 1;
            justify-content: center;
            gap: 18px;
        }

        .nav-links a {
            color: #bbffc1;
            text-decoration: none;
            transition: 0.2s;
            position: relative;
            display: inline-block;
        }

        .nav-links a:hover {
            color: #88ff00;
            text-shadow: 0 0 6px #88ff00;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -4px;
            width: 0%;
            height: 1px;
            background: #88ff00;
            transition: 0.2s;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .nav-links a::before,
        .nav-links a::after {
            content: attr(data-text);
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0.7;
            pointer-events: none;
        }

        .nav-links a::before {
            color: #00ffea;
            animation: glitch1 0.6s infinite;
        }

        .nav-links a::after {
            color: #ff008c;
            animation: glitch2 0.6s infinite;
        }

        .system-right {
            color: #777;
            font-size: 13px;
            white-space: nowrap;
        }


h1 {
    text-align: center;
    color: #88ff00;
    margin-top: 30px;
    text-shadow: 0 0 10px rgb(136,255,0);
}

.wrapper {
    display: flex;
    gap: 25px;
    max-width: 950px;
    margin: 30px auto;
    padding: 10px;
}

.col {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.card {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #111;
    padding: 16px;
    border: 1px solid #333;
}

.card img {
    width: 65px;
    height: 65px;
    object-fit: cover;
    border: 1px solid #333;
}

.info h3 {
    margin: 0;
    font-size: 18px;
    color: #bbffc1;
}

.info a {
    display: inline-block;
    margin-top: 5px;
    color: #88ff00;
    text-decoration: none;
    font-size: 15px;
}

.info a:hover {
    color: white;
}

.col.right .card {
    flex-direction: row-reverse;
    text-align: right;
}


@media (max-width: 700px) {

    .wrapper {
        flex-direction: column;
    }

    .col.right .card {
        flex-direction: row;
        text-align: left;
    }
     .menu-toggle {
                display: block;
            }

            .navbar {
                position: relative;
            }

                position: absolute;
                top: 55px;
                right: 10px;
                width: 160px;

                align-items: flex-start;
                gap: 6px;
                padding: 10px;

                border: 1px solid #88ff00;
                border-radius: 6px;
                z-index: 9999;
            }

            }
              #time {
                position: absolute;
                left: 50%;
                transform: translateX(-50%);
                color: #777;
                font-size: 13px;
            }

}

</style>
